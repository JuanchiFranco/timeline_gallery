name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela la ejecución anterior de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # El código generado de drift se versiona (docs/decisions.md, D10): no hace
      # falta build_runner.
      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

  android:
    name: APK de release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Sin android/key.properties se firma con la clave de debug: sirve para
      # comprobar que el release compila (R8 incluido), no para publicar.
      - run: flutter build apk --release

      # La app promete no usar Internet: el manifiesto de release no debe
      # pedir ese permiso.
      - name: Verificar que el release no declara INTERNET
        run: |
          AAPT="$(ls $ANDROID_HOME/build-tools/*/aapt | sort | tail -1)"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "El APK de release declara INTERNET, pero la app promete no usarlo."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
