# Genera los iconos de Android e iOS a partir de assets/icon:
#   dart run flutter_launcher_icons
# Para cambiar el diseño, sustituye los PNG (1024x1024) y vuelve a ejecutarlo.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#C2603A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
